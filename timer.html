<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unterrichts-Timer</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --accent: #5b5bd6;
    --text: #111827;
    --red: #e5484d;
    --track: rgba(91, 91, 214, 0.15);
    /* Grundeinheit: 1/100 der Breite, begrenzt durch die Höhe (Querformat ca. 2,7 : 1) */
    --u: min(1vw, 2.7vh);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent !important;
  }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .timer {
    display: flex;
    align-items: center;
    gap: calc(5 * var(--u));
  }

  /* Ring */
  .ring { width: calc(26 * var(--u)); height: calc(26 * var(--u)); flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--track); stroke-width: 8; }
  .progress {
    fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear, stroke 0.3s;
  }

  /* Ziffern */
  .digits { display: flex; align-items: center; }
  .digit {
    display: flex; flex-direction: column; align-items: center;
    width: calc(11.5 * var(--u));
  }
  .num {
    font-size: calc(20 * var(--u));
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .colon {
    font-size: calc(20 * var(--u));
    font-weight: 500;
    line-height: 1;
    padding: 0 calc(0.5 * var(--u));
    transform: translateY(-0.06em);
  }
  .step {
    border: none; background: none; cursor: pointer;
    color: var(--text);
    font-size: calc(4 * var(--u));
    line-height: 1;
    width: calc(8 * var(--u)); height: calc(6 * var(--u));
    border-radius: calc(1 * var(--u));
  }
  .step:hover { background: rgba(17, 24, 39, 0.06); }
  .hidden .step { visibility: hidden; }

  /* Knöpfe */
  .buttons { display: flex; flex-direction: column; gap: calc(3 * var(--u)); }
  .btn {
    width: calc(8 * var(--u)); height: calc(8 * var(--u));
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn svg { width: 45%; height: 45%; }
  .play { background: var(--accent); border: none; }
  .play svg { fill: #fff; }
  .stop { background: transparent; border: calc(0.25 * var(--u)) solid var(--text); }
  .stop svg { fill: none; stroke: var(--text); stroke-width: 2.4; }

  .done .num, .done .colon { color: var(--red); animation: blink 0.6s ease-in-out 6; }
  .done .progress { stroke: var(--red); }
  @keyframes blink { 50% { opacity: 0.25; } }
</style>
</head>
<body>
  <div class="timer" id="timer">
    <div class="ring">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="44"></circle>
        <circle class="progress" id="progress" cx="50" cy="50" r="44"></circle>
      </svg>
    </div>

    <div class="digits" id="digits">
      <div class="digit"><button class="step" data-d="0" data-s="1">+</button><span class="num" id="d0">1</span><button class="step" data-d="0" data-s="-1">−</button></div>
      <div class="digit"><button class="step" data-d="1" data-s="1">+</button><span class="num" id="d1">0</span><button class="step" data-d="1" data-s="-1">−</button></div>
      <span class="colon">:</span>
      <div class="digit"><button class="step" data-d="2" data-s="1">+</button><span class="num" id="d2">0</span><button class="step" data-d="2" data-s="-1">−</button></div>
      <div class="digit"><button class="step" data-d="3" data-s="1">+</button><span class="num" id="d3">0</span><button class="step" data-d="3" data-s="-1">−</button></div>
    </div>

    <div class="buttons">
      <button class="btn play" id="playBtn" title="Start / Pause">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
      </button>
      <button class="btn stop" id="stopBtn" title="Stopp / Zurücksetzen">
        <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
    </div>
  </div>

<script>
  const R = 44, CIRC = 2 * Math.PI * R;
  const $ = id => document.getElementById(id);
  const progress = $('progress');
  progress.style.strokeDasharray = CIRC;

  const PLAY = '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/>';
  const PAUSE = '<rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/>';

  let total = 600;        // eingestellte Dauer in Sekunden (Start: 10:00)
  let remaining = 600;
  let running = false;
  let endAt = 0;
  let tick = null;
  let audioCtx = null;
  let officeReady = false;

  function digitsOf(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return [Math.floor(m / 10), m % 10, Math.floor(s / 10), s % 10];
  }

  function render() {
    digitsOf(remaining).forEach((v, i) => $('d' + i).textContent = v);
    const frac = total > 0 ? remaining / total : 0;
    progress.style.strokeDashoffset = CIRC * (1 - frac);
    const atStart = !running && remaining === total;
    $('digits').classList.toggle('hidden', !atStart);
    $('playIcon').innerHTML = running ? PAUSE : PLAY;
  }

  // Eine einzelne Ziffer hoch-/runterschalten (Zehner-Sekunden 0–5, sonst 0–9)
  function stepDigit(i, dir) {
    if (running) return;
    if (remaining !== total) reset();
    const d = digitsOf(total);
    const max = (i === 2) ? 6 : 10;
    d[i] = (d[i] + dir + max) % max;
    total = (d[0] * 10 + d[1]) * 60 + d[2] * 10 + d[3];
    remaining = total;
    $('timer').classList.remove('done');
    save();
    render();
  }

  function start() {
    if (total <= 0) return;
    if (remaining <= 0) remaining = total;
    $('timer').classList.remove('done');
    initAudio();
    running = true;
    endAt = Date.now() + remaining * 1000;
    tick = setInterval(update, 200);
    render();
  }

  function pause() {
    running = false;
    clearInterval(tick);
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    render();
  }

  function reset() {
    running = false;
    clearInterval(tick);
    remaining = total;
    $('timer').classList.remove('done');
    render();
  }

  function update() {
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    if (remaining <= 0) {
      running = false;
      clearInterval(tick);
      remaining = 0;
      finish();
    }
    render();
  }

  function finish() {
    const t = $('timer');
    t.classList.remove('done');
    void t.offsetWidth;
    t.classList.add('done');
    playBeep();
  }

  // ---- Ton (ein kurzer Ton) ----
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function playBeep() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
    gain.gain.linearRampToValueAtTime(0, t + 0.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.52);
  }

  // ---- Eingestellte Zeit in der Präsentation speichern ----
  function save() {
    if (!officeReady) return;
    try {
      const s = Office.context.document.settings;
      s.set('timerSeconds', total);
      s.saveAsync();
    } catch (e) {}
  }
  function load() {
    try {
      const t = Office.context.document.settings.get('timerSeconds');
      if (typeof t === 'number' && t > 0) { total = t; remaining = t; }
    } catch (e) {}
    render();
  }

  // ---- Bedienung ----
  $('playBtn').addEventListener('click', () => running ? pause() : start());
  $('stopBtn').addEventListener('click', reset);
  document.querySelectorAll('.step').forEach(b =>
    b.addEventListener('click', () => stepDigit(Number(b.dataset.d), Number(b.dataset.s))));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
  });

  render();
  if (window.Office && Office.onReady) {
    Office.onReady(() => {
      officeReady = !!(Office.context && Office.context.document);
      if (officeReady) load();
    });
  }
</script>
</body>
</html>
